<div class="layout">
<nav id="side" class="side hidden" aria-label="Navigation"><a class="brand" href="index.html" aria-label="EDUNOTA : retour à l'accueil du site">EDUNOTA</a>
  <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Accueil</span></button>
  <button data-tab="dash" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg><span>Analyse</span></button>
  <button data-tab="notes" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12"/><text x="12" y="9" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">18</text><text x="12" y="20" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">20</text></svg><span>Notes</span></button>
  <button data-tab="edt" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Emploi du temps</span></button>
  <button data-tab="messages" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Messagerie</span></button>
  <button data-tab="devoirs" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 16h11"/></svg><span>Cahier de texte</span></button>
  <button data-tab="espaces" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.8 4 4.5"/></svg><span>Espaces de travail</span></button>

<main>
  <section id="login" class="card">
    <label for="id">Identifiant EcoleDirecte</label>
    <input id="id" autocomplete="username">
    <label for="pw">Mot de passe</label>
    <div class="pwrap"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="eye" class="eye" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <label class="keep"><input type="checkbox" id="keep"> Rester connecté sur cet appareil</label>
    <button id="go">Se connecter</button>
    <div id="loginErr" class="err" role="alert"></div>
    <p class="mute">Tes identifiants ne quittent pas ton ordinateur, sauf vers EcoleDirecte. Seul l'identifiant est mémorisé, jamais le mot de passe.</p>
  </section>

  <section id="qcm" class="card hidden">
    <h2 id="question" style="font-size:1.05rem"></h2>
    <label for="choix">Ta réponse</label>
    <select id="choix"></select>
    <button id="qcmGo">Valider</button>
    <div id="qcmErr" class="err" role="alert"></div>
  </section>

  <section id="app" class="hidden">
    <h1 id="ptitle" class="ptitle"></h1>
    <div id="view"></div>
    <div id="appErr" class="err" role="alert"></div>
  </section>
</main>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="mbox"><button type="button" class="mclose" aria-label="Fermer">×</button><h3 id="mtitle"></h3><div id="mbody"></div></div></div>
