<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon carnet</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="top"><button id="burger" class="burger" aria-label="Menu">☰</button><span id="school"></span><span class="grow"></span><select id="eleve" class="hidden" aria-label="Élève"></select><button id="theme" class="icon" aria-label="Changer de thème">◐</button><span id="who" class="pill hidden"></span><button id="logout" class="logout hidden">Déconnexion</button></header>
<div class="layout">
<nav id="side" class="side hidden" aria-label="Navigation"><div class="brand">CARNET</div>
  <button data-tab="dash" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg><span>Analyse</span></button>
  <button data-tab="notes" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12"/><text x="12" y="9" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">18</text><text x="12" y="20" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">20</text></svg><span>Notes</span></button>
  <button data-tab="edt" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Emploi du temps</span></button>
</nav>
<main>
  <section id="login" class="card">
    <label for="id">Identifiant EcoleDirecte</label>
    <input id="id" autocomplete="username">
    <label for="pw">Mot de passe</label>
    <div class="pwrap"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="eye" class="eye" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button id="go">Se connecter</button>
    <div id="loginErr" class="err" role="alert"></div>
    <p class="mute">Tes identifiants ne quittent pas ton ordinateur, sauf vers EcoleDirecte. Seul l'identifiant est mémorisé, jamais le mot de passe.</p>
  </section>

  <section id="qcm" class="card hidden">
    <h2 id="question" style="font-size:1.05rem"></h2>
    <label for="choix">Ta réponse</label>
    <select id="choix"></select>
    <button id="qcmGo">Valider</button>
    <div id="qcmErr" class="err" role="alert"></div>
  </section>

  <section id="app" class="hidden">
    <h1 id="ptitle" class="ptitle"></h1>
    <div id="view"></div>
    <div id="appErr" class="err" role="alert"></div>
  </section>
</main>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
