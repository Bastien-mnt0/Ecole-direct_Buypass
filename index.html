<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon carnet</title>
<style>
:root,:root[data-theme=light]{--bg:#f3f5f7;--card:#fff;--p2:#f0f2f5;--g1:#f0f2f5;--line:#e1e4e8;--ink:#1e2329;--mute:#707a8a;--good:#0a9f62;--bad:#d9304a;--mid:#b7860b;--accent:#c99400;--blue:#2b6fd8;color-scheme:light}
:root[data-theme=dark]{--bg:#0b0e11;--card:#12161c;--p2:#1a1f27;--g1:#1a1f27;--line:#252b34;--ink:#e6e8ea;--mute:#848e9c;--good:#0ecb81;--bad:#f6465d;--mid:#f0b90b;--accent:#f0b90b;--blue:#5b9cff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.num,.kpi b,td.c-avg,.bx,.v{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
.top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
body:has(.side:not(.hidden)) .top{padding-left:212px}
.top .grow{flex:1}
#school{font-weight:600;color:var(--mute)}
.top select{width:auto;padding:4px 8px}
.pill{background:var(--p2);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.8rem}
.logout{margin:0;background:none;color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:3px 12px;font-size:.8rem}
.icon{margin:0;background:var(--p2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:1rem;line-height:1}
.burger{display:none;margin:0;background:none;color:var(--ink);font-size:1.4rem;padding:0 8px;line-height:1}
.layout{display:flex;align-items:stretch}
.side{position:relative;z-index:2;width:196px;flex:none;background:var(--card);border-right:1px solid var(--line);margin-top:-48px;min-height:100vh}
.side .brand{height:48px;display:flex;align-items:center;padding:0 18px;font-weight:800;letter-spacing:.14em;color:var(--accent);border-bottom:1px solid var(--line)}
.side button{display:flex;align-items:center;gap:12px;width:100%;margin:2px 0 0;padding:11px 16px;background:none;color:var(--mute);border:0;border-left:3px solid transparent;border-radius:0;font-weight:500;text-align:left}
.side button[aria-selected=true]{color:var(--ink);background:var(--p2);border-left-color:var(--accent)}
.side svg{flex:none}
main{flex:1;min-width:0;max-width:1240px;padding:0 24px 64px}
.ptitle{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;margin:20px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
label{display:block;font-weight:600;font-size:.8rem;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--p2);color:var(--ink);font:inherit}
button{padding:9px 16px;border:0;border-radius:6px;background:var(--accent);color:#0b0e11;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);margin-top:12px;min-height:1.2em}
.mute{color:var(--mute);font-size:.86rem}
.num{font-weight:700;white-space:nowrap}
.hidden{display:none!important}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 8px;margin-left:6px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ptab{margin:0;padding:6px 14px;background:var(--p2);color:var(--mute);border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:.82rem;white-space:nowrap}
.ptab[aria-selected=true]{background:var(--accent);color:#0b0e11;border-color:var(--accent)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px}
.subtabs button{flex:1;margin:0;background:none;color:var(--mute);border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px;font-weight:600}
.subtabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px;text-align:left;font-size:.72rem;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--p2)}
td.disc i{font-size:.74rem;margin-left:8px;font-weight:400;color:var(--mute)}
tr.grp td{background:var(--p2);font-weight:700;color:var(--accent)}
tr.gen td{border-top:2px solid var(--line);font-weight:700}
tr.gen td.c-avg{font-size:1.15rem;color:var(--accent)}
td.r{text-align:right}
.ev{margin-right:14px;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.ev.new{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.ev.ns{color:var(--mute)}
.ev sub,.ev sup{font-size:.68em;color:var(--mute)}
.cf{display:none}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim input{width:72px;padding:5px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.mrow.head{justify-content:space-between;background:var(--p2);font-weight:700}
.mrow i{display:block;font-size:.8rem;color:var(--mute)}
.bx{border:1px solid var(--line);background:var(--p2);padding:4px 8px;border-radius:6px;font-size:.9rem;line-height:1.3;white-space:nowrap}
.bx small{display:block;color:var(--mute)}
.stat{padding:10px 14px;font-size:.88rem;color:var(--mute)}
.nav2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nav2 button{margin:0 0 0 6px;background:var(--p2);color:var(--ink);border:1px solid var(--line);padding:4px 10px}
.cal{display:flex;overflow-x:auto;border-top:1px solid var(--line);margin-top:14px}
.axis{width:48px;flex:none;font-size:.7rem;color:var(--mute)}
.hr{border-top:1px solid var(--line);padding-left:4px}
.dcol{flex:1;min-width:112px;border-left:1px solid var(--line)}
.dh{height:28px;line-height:28px;text-align:center;font-size:.75rem;border-bottom:1px solid var(--line);text-transform:capitalize;color:var(--mute)}
.dbody{position:relative;overflow:hidden;background-image:repeating-linear-gradient(transparent 0 calc(var(--px,56px) - 1px),var(--line) calc(var(--px,56px) - 1px) var(--px,56px))}
.dcol.today .dbody{background-color:color-mix(in srgb,var(--accent) 9%,var(--card))}
.dcol.today .dh{color:var(--accent);font-weight:700}
.blk{position:absolute;left:2px;right:2px;color:#fff;font-size:.72rem;padding:3px 6px;overflow:hidden;line-height:1.25;border-radius:4px}
.blk b{display:block;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--mute);font-size:.75rem}
.kpi b{display:block;font-size:1.6rem;line-height:1.25}
.up{color:var(--good)}.dn{color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.panel h3{font-size:.92rem;margin-bottom:6px}
.panel svg{width:100%;height:auto;display:block}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl select{width:auto}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.scard header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scard .v{font-size:1.3rem;font-weight:700}
.chip{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip.up{background:color-mix(in srgb,var(--good) 18%,transparent)}
.chip.dn{background:color-mix(in srgb,var(--bad) 18%,transparent)}
@media (max-width:760px){
 input,select{font-size:16px}
 body:has(.side:not(.hidden)) .top{padding-left:8px}
 body:has(.side:not(.hidden)) .burger{display:block}
 #school{display:none}
 .side{position:fixed;top:0;left:0;bottom:0;margin-top:0;width:240px;min-height:0;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
 main{padding:0 12px 64px}
 .ptitle{margin:14px 0 8px}
 .ptabs{flex-wrap:nowrap;overflow-x:auto}
 #view>.card{padding:8px}
 table,tbody{display:block}
 thead{display:none}
 tr{display:grid;grid-template-columns:92px 1fr;align-items:center;border-top:1px solid var(--line)}
 td{border:0;padding:6px 8px}
 tr:hover td{background:none}
 td.c-coef,td.c-x{display:none}
 td.disc{grid-column:2;grid-row:1}
 td.disc i{display:block;margin:2px 0 0}
 td.c-avg{grid-column:1;grid-row:1;margin:8px 0;padding:6px 8px;border:1px solid var(--line);background:var(--p2);border-radius:6px;font-size:1rem;line-height:1.3}
 .cf{display:block;color:var(--mute);font-size:.72rem}
 td.c-ev{grid-column:1/-1;grid-row:2;padding:8px;font-size:1.05rem}
 td.c-ev:empty{display:none}
 .ev{display:inline-block;margin-right:20px}
 tr.grp,tr.gen{grid-template-columns:1fr auto;background:var(--p2);border-radius:6px;margin-top:8px}
 tr.grp td:first-child,tr.gen td.gl{grid-column:1;grid-row:1;text-align:left}
 tr.grp td.c-avg,tr.gen td.c-avg{grid-column:2;grid-row:1;margin:6px}
 tr.grp td.c-ev{display:none}
 tr.gen td.note{grid-column:1/-1;grid-row:2;font-size:.78rem}
 #testnote{padding:10px 4px!important}
 .kpis{grid-template-columns:1fr 1fr}
 .dcol{min-width:0}
}
</style>
</head>
<body>
<header class="top"><button id="burger" class="burger" aria-label="Menu">☰</button><span id="school"></span><span class="grow"></span><select id="eleve" class="hidden" aria-label="Élève"></select><button id="theme" class="icon" aria-label="Changer de thème">◐</button><span id="who" class="pill hidden"></span><button id="logout" class="logout hidden">Déconnexion</button></header>
<div class="layout">
<nav id="side" class="side hidden" aria-label="Navigation"><div class="brand">CARNET</div>
  <button data-tab="dash" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg><span>Analyse</span></button>
  <button data-tab="notes" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12"/><text x="12" y="9" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">18</text><text x="12" y="20" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">20</text></svg><span>Notes</span></button>
  <button data-tab="edt" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Emploi du temps</span></button>
</nav>
<main>
  <section id="login" class="card">
    <label for="id">Identifiant EcoleDirecte</label>
    <input id="id" autocomplete="username">
    <label for="pw">Mot de passe</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go">Se connecter</button>
    <div id="loginErr" class="err" role="alert"></div>
    <p class="mute">Tes identifiants ne quittent pas ton ordinateur, sauf vers EcoleDirecte. Seul l'identifiant est mémorisé, jamais le mot de passe.</p>
  </section>

  <section id="qcm" class="card hidden">
    <h2 id="question" style="font-size:1.05rem"></h2>
    <label for="choix">Ta réponse</label>
    <select id="choix"></select>
    <button id="qcmGo">Valider</button>
    <div id="qcmErr" class="err" role="alert"></div>
  </section>

  <section id="app" class="hidden">
    <h1 id="ptitle" class="ptitle"></h1>
    <div id="view"></div>
    <div id="appErr" class="err" role="alert"></div>
  </section>
</main>
</div>

<script>
// Adresse du relais : vide = même origine (node server.js en local).
// Pour GitHub Pages, mets l'URL de ton Cloudflare Worker, ex. 'https://ed-proxy.xxx.workers.dev'
const PROXY_URL = 'https://ecole-direct-buypass.didierbleu90.workers.dev';
const $ = (s) => document.querySelector(s);
const S = { cookies: {}, token: null, eleves: [], eleve: null, notes: null, tab: 'notes', week: 0, dayOff: 0, sub: 'eval', edtView: matchMedia('(max-width:760px)').matches ? 'day' : 'week', subjects: [] };
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- Utilitaires ----------
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
const toNum = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmt = (n, d = 2) => (n == null ? '–' : n.toFixed(d).replace('.', ','));
const color = (n) => (n == null ? 'var(--mute)' : n >= 14 ? 'var(--good)' : n >= 10 ? 'var(--mid)' : 'var(--bad)');
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const longDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const hue = (s) => { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const textOf = (html) => new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();

function show(view) {
  for (const v of ['login', 'qcm', 'app']) $('#' + v).classList.toggle('hidden', v !== view);
  $('#logout').classList.toggle('hidden', view !== 'app');
  $('#side').classList.toggle('hidden', view !== 'app');
  $('#who').classList.toggle('hidden', view !== 'app');
  if (view !== 'app') $('#eleve').classList.add('hidden');
}

async function api(path, data) {
  const r = await fetch(PROXY_URL + '/api/ed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, data, token: S.token, cookies: S.cookies }) });
  const o = await r.json().catch(() => ({ error: 'Relais injoignable : renseigne PROXY_URL dans index.html' }));
  if (o.error) throw new Error(o.error);
  if (o.token) S.token = o.token;
  if (o.cookies) S.cookies = o.cookies;
  if ([520, 521, 525].includes(o.json.code)) {
    show('login'); $('#loginErr').textContent = 'Session expirée : reconnecte-toi.';
    throw new Error('Session expirée');
  }
  return o.json;
}

$('#burger').onclick = () => $('#side').classList.toggle('open');
const applyTheme = (t) => { document.documentElement.dataset.theme = t; store.set('ed-theme', t); };
applyTheme(store.get('ed-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
// ---------- Connexion ----------
function setWho() { $('#school').textContent = S.school || ''; $('#who').textContent = `${S.eleve.prenom} ${S.eleve.nom || ''}`.trim(); }
async function login(fa = []) {
  const res = await api('/v3/login.awp', { identifiant: $('#id').value.trim(), motdepasse: $('#pw').value, isReLogin: false, uuid: '', fa });
  if (res.code === 250) return startQcm();
  if (res.code !== 200) throw new Error(res.message || 'Connexion refusée (code ' + res.code + ')');
  const acc = res.data.accounts[0];
  S.eleves = acc.typeCompte === 'E' ? [acc] : acc.profile?.eleves || [];
  if (!S.eleves.length) throw new Error('Aucun élève trouvé sur ce compte.');
  if (res.token) S.token = res.token;
  store.set('ed-id', $('#id').value.trim());
  $('#pw').value = '';
  const sel = $('#eleve');
  sel.innerHTML = S.eleves.map((e, i) => `<option value="${i}">${esc(e.prenom)} ${esc(e.nom || '')}</option>`).join('');
  sel.classList.toggle('hidden', S.eleves.length < 2);
  S.eleve = S.eleves[0]; S.notes = null; S.school = acc.nomEtablissement || ''; setWho();
  show('app'); openTab('dash');
}

async function startQcm() {
  const q = await api('/v3/connexion/doubleauth.awp?verbe=get', {});
  if (q.code !== 200) throw new Error(q.message || 'Double authentification impossible');
  $('#question').textContent = b64(q.data.question);
  $('#choix').innerHTML = q.data.propositions.map((p) => `<option value="${esc(p)}">${esc(b64(p))}</option>`).join('');
  show('qcm');
}

async function doLogin() {
  $('#loginErr').textContent = '';
  $('#go').disabled = true;
  try {
    const g = await (await fetch(PROXY_URL + '/api/gtk', { method: 'POST' })).json();
    S.cookies = g.cookies || {};
    await login();
  }
  catch (e) { $('#loginErr').textContent = e.message; }
  $('#go').disabled = false;
}
$('#go').onclick = doLogin;
$('#pw').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
$('#id').value = store.get('ed-id', '');
$('#qcmGo').onclick = async () => {
  $('#qcmErr').textContent = '';
  try {
    const r = await api('/v3/connexion/doubleauth.awp?verbe=post', { choix: $('#choix').value });
    if (r.code !== 200) throw new Error(r.message || 'Mauvaise réponse');
    await login([{ cn: r.data.cn, cv: r.data.cv }]);
  } catch (e) { $('#qcmErr').textContent = e.message; }
};
$('#logout').onclick = () => location.reload();
$('#eleve').onchange = (e) => { S.eleve = S.eleves[+e.target.value]; S.notes = null; setWho(); openTab(S.tab); };

// ---------- Onglets ----------
function openTab(name) {
  S.tab = name; $('#side').classList.remove('open');
  $('#ptitle').textContent = { dash: 'Analyse', notes: 'Notes et Moyennes', edt: 'Emploi du temps' }[name];
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === name));
  $('#appErr').textContent = '';
  $('#view').innerHTML = '<p class="mute">Chargement…</p>';
  ({ dash: loadDash, notes: loadNotes, edt: loadEdt })[name]().catch((e) => { $('#view').innerHTML = ''; $('#appErr').textContent = e.message; });
}
document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => openTab(b.dataset.tab)));

// ---------- Notes ----------
const sig = (n) => !(n.nonSignificatif === true || n.nonSignificatif === 'true');
function avg(list, key = 'valeur') {
  let s = 0, c = 0;
  for (const n of list) {
    const v = toNum(n[key]); if (v == null || !sig(n)) continue;
    const on = toNum(n.noteSur) || 20, k = toNum(n.coef) || 1;
    s += (v / on) * 20 * k; c += k;
  }
  return c ? s / c : null;
}
function groupBy(notes) {
  const g = {};
  for (const n of notes) (g[n.codeMatiere] ||= { code: n.codeMatiere, name: n.libelleMatiere, notes: [] }).notes.push(n);
  return Object.values(g).sort((a, b) => a.name.localeCompare(b.name));
}
// Comme EcoleDirecte : moyenne de matière = notes pondérées par leur coef (ramenées sur 20, notes
// « non significatives » ignorées) ; moyenne générale / de bloc = moyenne des matières pondérée par le coef de matière.
let ST = { coef: {}, official: {}, blocs: [] };
function structure() {
  const ps = S.notes.periodes || [];
  const p = ps.find((x) => x.codePeriode === S.periode) || ps.find((x) => x.annuel) || ps[ps.length - 1];
  const coef = {}, official = {}, order = [], blocs = [];
  let cur = null;
  for (const d of p?.ensembleMatieres?.disciplines || []) {
    if (d.groupeMatiere) { cur = { name: d.discipline, codes: [], st: [d.moyenneClasse, d.moyenneMin, d.moyenneMax] }; blocs.push(cur); order.push({ head: cur }); continue; }
    if (d.sousMatiere) continue;
    coef[d.codeMatiere] = toNum(d.coef) ?? 1;
    official[d.codeMatiere] = toNum(d.moyenne);
    const gid = d.idGroupeMatiere;
    if (cur && (gid === undefined || String(gid) !== '0')) cur.codes.push(d.codeMatiere); else cur = null;
    order.push({ st: [d.moyenneClasse, d.moyenneMin, d.moyenneMax], code: d.codeMatiere, name: d.discipline, prof: (d.professeurs || []).map((x) => x.nom).join(' · ') });
  }

  const f = new Date(base); f.setDate(f.getDate() + S.dayOff); const focus = iso(f);
  const mon = new Date(day ? f : base); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + (day ? 0 : S.week * 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const r = await api(`/v3/E/${S.eleve.id}/emploidutemps.awp?verbe=get`, { dateDebut: iso(mon), dateFin: iso(sun), avecTrous: false });
  if (r.code !== 200) throw new Error(r.message || "Impossible de charger l'emploi du temps");
  const min = (t) => +t.slice(11, 13) * 60 + +t.slice(14, 16);
  const H0 = 7, H1 = 20;
  const PX = day ? 80 : 56, today = iso(new Date());
  const hours = Array.from({ length: H1 - H0 }, (_, k) => `<div class="hr" style="height:${PX}px">${String(H0 + k).padStart(2, '0')}:00</div>`).join('');
  const cols = [...Array(7)].map((_, k) => {
    const d = new Date(mon); d.setDate(mon.getDate() + k); const key = iso(d);
    if (day && key !== focus) return '';
    const blocks = r.data.filter((c) => c.start_date.slice(0, 10) === key).map((c) => {
      const top = ((min(c.start_date) - H0 * 60) / 60) * PX, h = ((min(c.end_date) - min(c.start_date)) / 60) * PX;
      const bg = c.isAnnule ? '#333' : c.color || `hsl(${hue(c.matiere || c.text)} 70% 38%)`;
      return `<div class="blk" style="top:${top}px;height:${h}px;background:${esc(bg)}"><b>${esc(c.start_date.slice(11, 16))} - ${esc(c.end_date.slice(11, 16))}${c.isAnnule ? ' · ANNULÉ' : ''}</b>${esc(c.text)}<br>${esc(c.prof)}${c.salle ? '<br>Salle ' + esc(c.salle) : ''}</div>`;
    }).join('');
    return `<div class="dcol ${key === today ? 'today' : ''}"><div class="dh">${esc(d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }))}</div><div class="dbody" style="height:${(H1 - H0) * PX}px;--px:${PX}px">${blocks}</div></div>`;
  }).join('');
  const fr = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
  $('#view').innerHTML = `<div class="card"><div class="nav2"><b>${day ? esc(longDate(focus)) : `${esc(fr(mon))} – ${esc(fr(sun))} (Semaine ${weekNo(mon)})`}</b><span><button id="tod">Aujourd'hui</button><button id="prev" aria-label="Semaine précédente">‹</button><button id="next" aria-label="Semaine suivante">›</button></span></div><div class="cal"><div class="axis"><div class="dh"></div>${hours}</div>${cols}</div></div>`;
  $('#tod').onclick = () => { S.week = 0; S.dayOff = 0; openTab('edt'); };
  $('#prev').onclick = () => { day ? S.dayOff-- : S.week--; openTab('edt'); };
  $('#next').onclick = () => { day ? S.dayOff++ : S.week++; openTab('edt'); };
  $('#view').insertAdjacentHTML('afterbegin', `<div class="subtabs"><button data-v="day" aria-selected="${day}">JOUR</button><button data-v="week" aria-selected="${!day}">SEMAINE</button></div>`);
  document.querySelectorAll('.subtabs button').forEach((b) => (b.onclick = () => { S.edtView = b.dataset.v; openTab('edt'); }));
}
</script>
</body>
</html>
